# Baseline single-colour Deployment manifest.
# Replace YOUR_DOCKERHUB_USERNAME with your Docker Hub username before manual use.
# The Jenkinsfile generates the corresponding blue/green manifest with the exact build tag.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-portal-blue
  labels:
    app: online-food
    track: blue
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: online-food
      track: blue
  template:
    metadata:
      labels:
        app: online-food
        track: blue
    spec:
      containers:
        - name: food-portal
          image: YOUR_DOCKERHUB_USERNAME/online-food-ordering:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
